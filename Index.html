<!doctype html><html lang="id"><head><base target="_top"><title>PAI Seru Kelas X</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky brand bar, single content column (max 940px), bottom tab bar. Motif: eight-point star (rub el hizb). */
:root{
  --bg:#EEF5F2; --surface:#FFFFFF; --ink:#10302A; --muted:#4A675F; --line:#CCDFD8;
  --brand:#0A6B58; --on-brand:#FFFFFF; --soft:#DCEEE7; --gold:#D79A0B; --gold-soft:#FBEFC7; --gold-ink:#6B4A00;
  --sea:#CFEAF5; --sea2:#A8D6EA; --ok:#1B8A4B; --ok-soft:#DDF3E5; --bad:#C0392F; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(16,48,42,.06),0 6px 18px rgba(16,48,42,.06);
  --sky:#CFEAF2; --sea:#3A9CC4; --sea2:#2678A0; --sun:#F7C948;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-ar:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1815; --surface:#14251F; --ink:#E6F3EE; --muted:#9CB8AF; --line:#25403A;
  --brand:#3CC9A3; --on-brand:#062119; --soft:#1A332C; --gold:#F2BD3B; --gold-soft:#3A3010; --gold-ink:#F7DB8A;
  --sea:#123642; --sea2:#0E2C37; --ok:#4CD08A; --ok-soft:#12372A; --bad:#FF8478; --bad-soft:#40201C; --sky:#16303B; --sea:#1E6A8C; --sea2:#16506C; --sun:#E8B83A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1815; --surface:#14251F; --ink:#E6F3EE; --muted:#9CB8AF; --line:#25403A;
  --brand:#3CC9A3; --on-brand:#062119; --soft:#1A332C; --gold:#F2BD3B; --gold-soft:#3A3010; --gold-ink:#F7DB8A;
  --sea:#123642; --sea2:#0E2C37; --ok:#4CD08A; --ok-soft:#12372A; --bad:#FF8478; --bad-soft:#40201C; --sky:#16303B; --sea:#1E6A8C; --sea2:#16506C; --sun:#E8B83A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:940px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.1px}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand svg{width:30px;height:30px;fill:none;stroke:var(--brand);stroke-width:5;stroke-linejoin:round}
.brand small{display:block;font:600 .68rem var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-4px}
#xpchip{background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
main{padding-top:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}

.h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
.h2{font-size:1.3rem;font-weight:700;margin-top:6px}
.h2.tight{margin:2px 0 12px}
.h3{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.sub{color:var(--muted);font-size:.93rem}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

.btn{background:var(--brand);color:var(--on-brand);border:2px solid var(--brand);border-radius:12px;padding:11px 18px;font-weight:800;min-height:44px;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:7px 14px;min-height:38px;font-size:.92rem}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.done{background:var(--soft);color:var(--brand);border-color:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;color:var(--brand);font-weight:800;padding:6px 0;text-align:left;min-height:36px}
.back::before{content:"\2190  "}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.lbl{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
.inp{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
textarea.inp{resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.namecard{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.namecard .lbl:nth-of-type(1){grid-column:1}.namecard .lbl:nth-of-type(2){grid-column:2}
.namecard .lbl{margin-top:0}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--brand);color:var(--on-brand);border-radius:22px;padding:28px 24px;display:flex;gap:20px;align-items:center;box-shadow:var(--shadow)}
.heroart{flex:none;width:112px;height:112px;opacity:.95}
.heroart svg{width:100%;height:100%;fill:none;stroke:var(--gold-soft);stroke-width:3.2;stroke-linejoin:round}
.hero .eyebrow{color:var(--gold-soft)}
.hero h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;margin:4px 0 8px}
.hero h1 span{color:var(--gold-soft)}
.hero .lead{color:inherit;opacity:.92}
.hero .btn{background:var(--gold-soft);border-color:var(--gold-soft);color:#3b2a00}
.hero .btn.ghost{background:transparent;color:var(--on-brand);border-color:color-mix(in srgb,var(--on-brand) 55%,transparent)}
.herotx{min-width:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat.lvl{flex-direction:row;align-items:center;gap:14px}
.sv{font:800 1.7rem var(--f-display)}.sv small{font-size:1rem;color:var(--muted)}
.sl{color:var(--muted);font-size:.88rem}
.bar{display:block;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.ring{--p:0;flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;background:var(--surface);border-radius:50%}
.ring b{position:relative;font:800 1.3rem var(--f-display)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badge{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;opacity:.6}
.badge svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--muted);stroke-width:7;stroke-linejoin:round}
.badge b{display:block;font-size:.95rem}.badge span{font-size:.8rem;color:var(--muted)}
.badge.on{opacity:1;border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.badge.on svg{stroke:var(--gold);fill:var(--gold)}
.badge.on span{color:var(--gold-ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.qk{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.qk:hover{border-color:var(--brand)}.qk b{font:700 1.1rem var(--f-display)}.qk span{color:var(--muted);font-size:.9rem}
.foot{border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;gap:8px}
.credit{font-size:1rem;color:var(--ink)}.credit b{color:var(--brand)}

/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.bcard{text-align:left;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.bcard:hover{border-color:var(--brand)}
.bn{flex:none;width:44px;height:44px;display:grid;place-items:center;font:800 1.2rem var(--f-display);color:var(--on-brand);background:var(--brand);border-radius:12px}
.bn.big{width:56px;height:56px;font-size:1.6rem;border-radius:16px}
.bt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.bt b{font:700 1.02rem/1.25 var(--f-display)}.bt small{color:var(--muted);font-size:.85rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-style:normal;font-size:.74rem;font-weight:700;background:var(--soft);color:var(--muted);border-radius:99px;padding:2px 10px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.bhead{display:flex;gap:14px;align-items:center}
.tj{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pt h3{font-size:1.02rem;margin-bottom:4px;color:var(--brand)}
.dalil{margin:0;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.ar{font:400 1.7rem/2.1 var(--f-ar);text-align:right;color:var(--ink);overflow-wrap:anywhere}
.dalil figcaption{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.dalil cite{font-style:normal;font-weight:800;font-size:.85rem;color:var(--brand)}
.kw{display:flex;flex-wrap:wrap;gap:8px}.kw span{background:var(--gold-soft);color:var(--gold-ink);font-weight:700;border-radius:99px;padding:5px 14px;font-size:.9rem}
.actbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:700;font-size:.9rem;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* games */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.gcard h2{font-size:1.25rem}.gcard p{color:var(--muted);font-size:.92rem;flex:1}
.gart{height:84px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.gart svg{height:62px;fill:none;stroke:var(--brand);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.g-tf .gart{background:var(--gold-soft)}.g-tf .gart svg{stroke:var(--gold-ink)}
.gfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.gfoot .btn{margin-left:auto}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1.05;border-radius:14px;border:2px solid var(--brand);background:var(--brand) repeating-linear-gradient(45deg,transparent 0 10px,color-mix(in srgb,var(--on-brand) 14%,transparent) 10px 12px);color:var(--ink);padding:6px;display:grid;place-items:center;min-width:0}
.mc span{font-size:.78rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.mc.up{background:var(--surface);border-color:var(--line)}
.mc.up.term{border-color:var(--brand);background:var(--soft)}
.mc.up.def{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.mc.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
@media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}.mc span{font-size:.72rem}}
.tfhead{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.92rem;align-items:center}
.lives{display:flex;gap:5px}.life{width:16px;height:16px;border-radius:50%;background:var(--line)}.life.on{background:var(--bad)}
.tbar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.tfq{padding:22px}.tfstate{font:700 .74rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-bottom:6px}
.tfs{font:700 1.25rem/1.4 var(--f-display)}
.tfbtn{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tfbtn .btn{padding:16px;font-size:1.1rem}
.fb{border-width:2px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fb.good{background:var(--ok-soft);border-color:var(--ok)}.fb.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:600;min-height:48px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.miss{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slot{counter-increment:s;display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);min-height:48px}
.slot::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--brand)}
.slot.fill{border-style:solid;border-color:var(--brand);color:var(--ink);background:var(--soft)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}.slot.no{border-color:var(--bad);background:var(--bad-soft)}
.ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.al{width:42px;height:50px;border-bottom:4px solid var(--line);display:grid;place-items:center;font:800 1.5rem var(--f-display);background:var(--bg);border-radius:8px 8px 0 0}
.al.f{border-color:var(--brand)}.al.ok{border-color:var(--ok);color:var(--ok)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:48px;height:52px;border-radius:12px;background:var(--brand);color:var(--on-brand);border:0;font:800 1.4rem var(--f-display)}
.tile:disabled{opacity:.25}
.result{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}.result .row{justify-content:center}
.big{font:800 3rem/1 var(--f-display);color:var(--brand)}
.qinfo{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.qinfo span{display:block;color:var(--muted);font-size:.9rem}
.qq{font:700 1.2rem/1.45 var(--f-display)}
.rev{display:flex;flex-direction:column;gap:6px}.r-ok{color:var(--ok);font-weight:700}

/* LKPD sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,4vw,28px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;min-width:0}
.sh{display:flex;flex-direction:column;gap:6px;border-bottom:3px double var(--line);padding-bottom:16px}
.idrow{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px}
.sn{width:30px;height:30px;display:grid;place-items:center;background:var(--gold);color:#2f2100;border-radius:8px;font-weight:800;flex:none}
.fill{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px;border-radius:12px;border:2px solid transparent}
.fill label{flex:1 1 100%}
.fill.ok{background:var(--ok-soft);border-color:var(--ok)}.fill.no{background:var(--bad-soft);border-color:var(--bad)}
.inl{width:min(240px,100%)}.after{color:var(--muted)}.ka{flex:1 1 100%;font-weight:700;color:var(--bad)}
.ess{display:flex;flex-direction:column;gap:6px}
details{background:var(--soft);border-radius:10px;padding:8px 12px}summary{cursor:pointer;font-weight:700;color:var(--brand)}details p{margin-top:6px;font-size:.93rem}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-weight:600}
.ck input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:2px}


/* lomba perahu */
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2f2100}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pc{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--gold)}
.pc b{font:700 1.1rem var(--f-display)}.pc em{font-style:normal;font-weight:800;font-size:.8rem;color:var(--brand)}.pc small{color:var(--muted);font-size:.85rem;line-height:1.4}
.pcs{display:block;background:linear-gradient(var(--sea),var(--sea2));border-radius:12px;padding:6px}
.pcs svg{display:block;width:100%;max-width:150px;margin:0 auto}
.pcs.big{max-width:190px}
.sea{position:relative;background:linear-gradient(var(--sea),var(--sea2));border:1px solid var(--line);border-radius:18px;padding:10px 10px 6px;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-width:0}
.seatop{display:flex;justify-content:space-between;font:800 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lane{position:relative;height:96px;border-bottom:2px dashed color-mix(in srgb,var(--brand) 25%,transparent)}
.lane.me{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px}
.boat{position:absolute;bottom:4px;width:96px;transition:left .9s cubic-bezier(.3,.8,.3,1)}
.bob{animation:bob 2.4s ease-in-out infinite}
.lane:nth-of-type(2n) .bob{animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.boat svg{display:block;width:96px;height:auto}
.bl{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font:800 .62rem var(--f-body);background:var(--surface);color:var(--ink);padding:0 7px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.goal{position:absolute;top:26px;bottom:6px;right:8px;width:10px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/10px 10px;border-radius:3px;opacity:.85}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.navin{display:flex;width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.navb{flex:1;background:none;border:0;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;font-weight:800;min-height:52px}
.navb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navb.on{background:var(--brand);color:var(--on-brand)}

:root:root:root{

  {h:"Apa itu syu'abul iman",p:"Syu'ab berarti cabang. Syu'abul iman adalah cabang-cabang iman, yaitu amalan yang tumbuh dari iman dan menjadi buktinya dalam kehidupan."},
  {h:"Tiga dimensi iman",p:"Tashdiq bil qalbi (meyakini dengan hati), iqrar bil lisan (mengucapkan dengan lisan), dan 'amal bil arkan (mengamalkan dengan anggota badan)."},
  {h:"Pembagian cabang iman",p:"Menurut Imam al-Baihaqi dalam kitab Syu'abul Iman, ada 77 cabang: 30 cabang amalan hati, 7 cabang amalan lisan, dan 40 cabang amalan anggota badan."},
  {h:"Contoh dalam keseharian",p:"Amalan hati: iman kepada Allah, malaikat, kitab, rasul, takdir. Amalan lisan: membaca kalimat thayyibah, membaca Al-Qur'an, dzikir dan istighfar. Amalan badan: bersuci, shalat, sedekah, puasa, haji, menuntut ilmu."},
  {h:"Disiplin, jujur, tanggung jawab",p:"Ketiganya cabang iman yang bisa dilatih sejak sekolah. Hadis menyebut malu juga salah satu cabang iman."},
  {h:"Manfaat",p:"Iman yang menyeluruh membuat seseorang lebih istikamah, kuat menghadapi godaan hawa nafsu dan tipu daya setan, serta lebih bermanfaat bagi sesama."}

{

  {h:"Riya'",p:"Beramal agar dilihat dan dipuji orang. Disebut syirik khafi, yaitu syirik yang samar dan tersembunyi. Contohnya mengaku ikhlas padahal hati mengharap pujian."},

  {h:"Takabur",p:"Menolak kebenaran dan meremehkan orang lain. Cirinya merasa lebih hebat, merendahkan orang, sulit mengakui kelebihan orang, dan tidak mau menerima saran."},
  {h:"Hasad",p:"Tidak senang melihat nikmat orang lain dan berharap nikmat itu hilang. Hasad memakan kebaikan seperti api memakan kayu bakar. Obatnya syukur dan mendoakan kebaikan."},
  {h:"Pelajaran bersama",p:"Kelimanya mengotori hati dan merugikan diri. Lawannya adalah hemat, ikhlas, rendah hati, qana'ah, dan lapang dada."}

 tujuan:["Menganalisis implementasi fikih muamalah: asuransi, bank, dan koperasi syariah","Menyajikan paparan tentang lembaga keuangan syariah","Menumbuhkan jiwa kewirausahaan dan kepedulian sosial"],
 poin:[
  {h:"Tujuan ekonomi syariah",p:"Berbeda dengan ekonomi konvensional yang menitikberatkan keuntungan duniawi, ekonomi syariah menyeimbangkan kepentingan dunia dan akhirat."},
  {h:"Bank syariah",p:"Menjalankan tiga usaha: menghimpun dana, menyalurkan dana, dan jasa pelayanan. Semuanya memakai prinsip bagi hasil dan menghindari riba, bukan bunga."},
  {h:"Akad yang sering dipakai",p:"Mudharabah (kerja sama modal dan pengelola dengan bagi hasil), musyarakah (patungan modal), murabahah (jual beli dengan margin terbuka), ijarah (sewa), istishna' (pesan buat), salam (pesan dengan bayar di muka), wadi'ah (titipan), qardh (pinjaman kebajikan)."},
  {h:"Asuransi syariah",p:"Dibangun atas semangat tolong-menolong (ta'awun). Peserta menyisihkan dana tabarru' (dana kebajikan) untuk membantu peserta yang tertimpa musibah."},
  {h:"Koperasi syariah",p:"Lembaga usaha bersama berprinsip kekeluargaan, gotong royong, dan bagi hasil. Contohnya baitul maal wat tamwil (BMT) yang membantu modal usaha kecil."},
  {h:"Menjauhi rentenir",p:"Pinjaman rentenir menerapkan bunga sangat tinggi yang mencekik peminjam. Ini praktik riba dan merugikan, sehingga hidup tidak maslahat."}
 ],

 poin:[
  {h:"Mudahnya masuk Islam",p:"Syarat menjadi muslim cukup mengucapkan dua kalimat syahadat. Ditambah semangat para juru dakwah dan saluran Islamisasi yang damai, Islam diterima luas oleh masyarakat Nusantara."},
  {h:"Teori Gujarat",p:"Dikemukakan antara lain oleh Snouck Hurgronje. Islam dianggap datang dari Gujarat, India, dan Samudra Pasai menjadi daerah awal pada abad ke-13 M."},
  {h:"Teori Makkah",p:"Buya Hamka berpendapat Islam dibawa langsung oleh saudagar dari Arab. Alasannya, catatan Ibnu Battuta (1345 M) menyebut Samudra Pasai bermazhab Syafi'i, sedangkan Gujarat disebut bermazhab Syi'ah."},
  {h:"Saluran Islamisasi",p:"Perdagangan, perkawinan, pendidikan, tasawuf, kesenian, dan politik. Para sultan memakai kekuasaannya untuk membantu penyebaran Islam secara damai."},
  {h:"Kesultanan Islam",p:"Samudra Pasai (abad ke-13), Demak, Aceh Darussalam, Banten, Mataram Islam, serta Ternate, Tidore, dan Gowa-Tallo di wilayah timur."},
  {h:"Teladan ulama",p:"Hidup sederhana dan semangat menuntut ilmu. Sikap ini bisa diterapkan setiap muslim di mana saja dan kapan saja, tergantung sikap, mental, dan tekad."}

 n:6, sem:2, t:"Menjauhi Pergaulan Bebas dan Perbuatan Zina", s:"Menjaga harkat dan martabat manusia",
 tujuan:["Membaca dan menghafal Q.S. al-Isra'/17: 32, Q.S. an-Nur/24: 2, dan hadis terkait","Menganalisis larangan pergaulan bebas dan zina","Membiasakan sikap menjaga kehormatan diri"],
 poin:[
  {h:"Pergaulan bebas",p:"Pergaulan yang tidak berlandaskan norma, aturan, dan batasan agama. Contohnya berduaan di tempat sepi dan kontak fisik dengan lawan jenis yang bukan mahram."},
  {h:"Zina",p:"Hubungan layaknya suami istri antara laki-laki dan perempuan yang tidak terikat pernikahan. Termasuk dosa besar."},
  {h:"Makna 'jangan mendekati'",p:"Larangan mendekati zina lebih luas daripada larangan berzina. Islam menutup semua jalan yang mengantarkan ke sana, seperti orang yang berdiri di tepi jurang mudah terjatuh."},
  {h:"Dampak di dunia dan akhirat",p:"Di dunia: hilang kewibawaan, kefakiran, dan umur terasa pendek. Di akhirat: murka Allah, hisab yang buruk, dan siksa yang pedih."},
  {h:"Cara menjaga diri",p:"Bergaul sehat dan beretika, menutup aurat, selektif memilih teman, menjauhi tempat maksiat, mengisi waktu dengan kegiatan positif, memperbanyak dzikir, dan berpuasa."},
  {h:"Catatan penting",p:"Hukuman dalam Q.S. an-Nur/24: 2 ditegakkan oleh pihak berwenang melalui proses yang sah, bukan oleh individu. Generasi muda dianjurkan selektif terhadap konten di media sosial dan gemar mengkaji Al-Qur'an dan hadis."}

{
 n:7, sem:2, t:"Mencintai Allah, Khauf, Raja', dan Tawakal", s:"Cabang iman yang menenangkan hati",
 tujuan:["Menganalisis hakikat mencintai Allah, khauf, raja', dan tawakal","Menganalisis tanda-tandanya dalam kehidupan","Membuat media pembelajaran tentang cabang iman ini"],
 poin:[
  {h:"Mencintai Allah (mahabbah)",p:"Iman tidak sempurna tanpa mengenal keagungan Allah, merasakan kebaikan-Nya, mengakui nikmat-Nya, dan mencintai-Nya. Allah juga mencintai hamba-Nya."},
  {h:"Tanda cinta kepada Allah",p:"Menurut Q.S. Ali Imran/3: 31, tandanya mengikuti dan mencintai Rasulullah Saw. Juga gemar mengingat Allah dan membaca Al-Qur'an serta mendahulukan perintah-Nya."},
  {h:"Khauf",p:"Rasa takut kepada Allah yang mencegah dari dosa. Menurut Imam al-Ghazali, di antaranya takut taubat tidak diterima, takut tidak istikamah, takut tertipu gemerlap dunia, dan takut terjerumus maksiat."},
  {h:"Raja'",p:"Berharap rahmat, ampunan, dan pahala Allah yang disertai usaha. Raja' mendorong kita taat."},
  {h:"Khauf dan raja' berpasangan",p:"Keduanya ibarat dua sayap burung. Khauf mencegah dosa, raja' mendorong taat. Orang yang memilikinya tidak mudah menghakimi orang lain karena semua keputusan ada di tangan Allah."},
  {h:"Tawakal",p:"Berusaha semaksimal mungkin lalu menyerahkan hasilnya kepada Allah. Tawakal bukan pasrah tanpa ikhtiar."}
 ],

 n:8, sem:2, t:"Menghindari Marah, Membiasakan Berani dan Kontrol Diri", s:"Akhlak madzmumah dan mahmudah agar hidup nyaman dan berkah",
 tujuan:["Menganalisis manfaat menghindari ghadhab","Menumbuhkan sikap kontrol diri dan berani membela kebenaran","Membiasakan sikap tersebut dalam keseharian"],
 poin:[
  {h:"Ghadhab (temperamental)",p:"Sikap mudah marah dan meledak-ledak. Akhlak madzmumah atau tercela yang dilarang agama."},
  {h:"Manfaat menghindari ghadhab",p:"Terhindar dari kebencian dan permusuhan, membawa kebahagiaan, dan mendapat pahala besar dari Allah."},
  {h:"Orang kuat sesungguhnya",p:"Hadis menegaskan orang kuat bukan yang menang bergulat, melainkan yang mampu menguasai dirinya saat marah."},
  {h:"Mujahadatun nafs",p:"Bersungguh-sungguh mengendalikan hawa nafsu. Manfaatnya menjaga kehormatan diri, terhindar dari merugikan orang lain, menyelesaikan masalah dengan pikiran jernih, dan menjadi teladan."},
  {h:"Syaja'ah",p:"Berani membela kebenaran dengan akhlak mulia, bukan nekat tanpa pertimbangan. Memberi kualitas mental yang dewasa, keluarga yang tenteram, dan masyarakat yang berani ber-amar ma'ruf nahi munkar."},
  {h:"Cara meredam marah",p:"Membaca ta'awudz, berwudu, mengubah posisi (dari berdiri menjadi duduk atau berbaring), diam sejenak, dan berdoa."}
 ],

{
 n:9, sem:2, t:"Al-Kulliyatu al-Khamsah dalam Kehidupan", s:"Lima prinsip pokok yang dijaga syariat",
 tujuan:["Menganalisis pengertian dan urutan al-kulliyatu al-khamsah","Menganalisis macam dan penerapannya dalam kehidupan","Menyajikan paparan dan menumbuhkan kepekaan sosial"],
 poin:[
  {h:"Pengertian",p:"Al-kulliyatu al-khamsah atau maqashid al-syari'ah adalah lima prinsip pokok yang dijaga dan dilindungi oleh hukum Islam."},
  {h:"Urutan lima prinsip",p:"Yang paling banyak disepakati ulama: agama (al-din), jiwa (al-nafs), akal (al-'aql), keturunan (al-nasl), dan harta (al-mal)."},
  {h:"Mengapa agama diutamakan",p:"Kehidupan akhirat kekal dan lebih utama. Untuk apa hidup sejahtera dan serba cukup bila akhirnya celaka di akhirat."},
  {h:"Dua cara menjaganya",p:"Min nahiyati al-wujud, yaitu memelihara hal yang mempertahankan keberadaannya. Min nahiyati al-'adam, yaitu mencegah hal yang menyebabkan ketiadaannya."},
  {h:"Contoh penerapan",p:"Menjaga jiwa dengan larangan membunuh, menjaga akal dengan larangan miras dan narkoba, menjaga keturunan dengan pernikahan dan larangan zina, menjaga harta dengan larangan mencuri dan korupsi."},
  {h:"Bila tidak terwujud",p:"Muncul ketimpangan beragama, kekacauan sosial, rasa gelisah dan khawatir, serta ketidakadilan dan konflik."}
 ],

{
 n:10, sem:2, t:"Peran Wali Songo dalam Penyebaran Islam", s:"Dakwah yang damai, santun, dan menghargai budaya",
 tujuan:["Menganalisis peran tokoh ulama Wali Songo dalam menyebarkan Islam","Mempresentasikan sejarah perjuangan dan metode dakwah yang damai","Membiasakan kesederhanaan, ketekunan, dan sikap menghargai perbedaan"],
 poin:[
  {h:"Metode dakwah",p:"Bi al-hikmah wa al-mau'idhatil hasanah: dengan kebijaksanaan dan nasihat yang baik, secara bertahap (tadrij) dan tanpa menyakiti (adamul haraj)."},
  {h:"Maulana Malik Ibrahim",p:"Berdakwah di Gresik lewat perdagangan dan pengobatan. Ia menolak pembagian manusia menurut kasta karena derajat manusia hanya dibedakan oleh takwa."},
  {h:"Sunan Ampel, Sunan Giri, dan Sunan Drajat",p:"Sunan Ampel mendirikan pesantren di Surabaya. Sunan Giri dikenal lewat pesantren dan pengaruhnya di Giri Kedaton. Sunan Drajat dikenal dengan kepedulian sosial kepada fakir miskin."},
  {h:"Sunan Bonang dan Sunan Kalijaga",p:"Sunan Bonang memakai alat musik bonang dan suluk bernuansa Islam. Sunan Kalijaga dikenal berdakwah lewat seni, seperti wayang dan tembang."},
  {h:"Sunan Kudus, Sunan Muria, dan Sunan Gunung Jati",p:"Sunan Kudus menghormati umat Hindu dengan melarang menyembelih sapi. Sunan Muria dekat dengan rakyat kecil. Sunan Gunung Jati berdakwah di Cirebon dan sekitarnya."},
  {h:"Pelajaran untuk kita",p:"Dakwah mengutamakan kelembutan, sopan santun, dan menghindari kekerasan. Teladan ini selaras dengan kehidupan bangsa yang beragam suku dan keyakinan."}

/* --- memory --- */
function gMemory(g) {
  if (g.fin) return '<section class="card result"><h2 class="h2">Semua pasangan ketemu</h2><p class="big">' + g.moves + ' langkah</p><p>' + (g.moves <= 9 ? "Hampir sempurna. Ingatanmu tajam." : "Bagus. Coba kurangi langkahmu pada putaran berikutnya.") + '</p><div class="row"><button class="btn" data-a="startgame" data-g="memory">Main lagi</button><button class="btn ghost" data-a="quitgame">Pilih game lain</button></div></section>';
  return '<p class="hint">Langkah: <b>' + g.moves + '</b> | Pasangan: <b>' + g.done.length / 2 + '/' + g.cards.length / 2 + '</b></p><div class="mem">' + g.cards.map((c, i) => {
    const up = g.open.includes(i) || g.done.includes(i);
    return '<button class="mc ' + c.c + (up ? " up" : "") + (g.done.includes(i) ? " ok" : "") + '" data-a="mflip" data-i="' + i + '" ' + (up ? 'aria-label="' + esc(c.t) + '"' : 'aria-label="Kartu tertutup"') + '><span>' + (up ? esc(c.t) : "") + '</span></button>';
  }).join("") + '</div>';
}
function mflip(i) {
  const g = ui.game;
  if (g.lock || g.open.includes(i) || g.done.includes(i)) return;
  g.open.push(i);
  if (g.open.length === 2) {
    g.moves++;
    const [a, b] = g.open;
    if (g.cards[a].k === g.cards[b].k) {
      g.done.push(a, b); g.open = [];
      if (g.done.length === g.cards.length) { g.fin = true; const xp = 20 + (g.moves <= 9 ? 10 : 0); S.games.memory = Math.min(S.games.memory || 99, g.moves); addXP(xp); }
    } else {
      g.lock = true; render();
      timers.push(setTimeout(() => { g.open = []; g.lock = false; if (ui.game === g) render(); }, 900));
      return;
    }
  }
  render();
}

/* --- benar salah --- */
function gTF(g) {
  if (g.fin) {
    const xp = g.score * 2;

  }
  const q = g.q[g.i];

  let h = '<div class="tfhead"><span>Soal ' + (g.i + 1) + ' dari ' + g.q.length + '</span><span class="lives" aria-label="Sisa nyawa ' + g.lives + '">' + lives + '</span><span>Skor <b>' + g.score + '</b></span></div><div class="tbar"><i id="tbar" style="width:' + (g.left / 12 * 100) + '%"></i></div>';
  h += '<section class="card tfq"><p class="tfstate">Bab ' + q.b + '</p><p class="tfs">' + esc(q.x[0]) + '</p></section>';
  if (g.ans === null) h += '<div class="tfbtn"><button class="btn ok" data-a="tfans" data-v="1">Benar</button><button class="btn bad" data-a="tfans" data-v="0">Salah</button></div>';
  else {

}
function startTick() {
  const g = ui.game;

    if (!ui.game || ui.game !== g || g.ans !== null || g.fin) return;

}

/* --- urutan --- */
function gUrut(g) {
  const chosen = g.pick.map(k => g.items.find(x => x.i === k));
  let h = '<section class="card"><p class="eyebrow">Bab ' + g.b + '</p><h2 class="h2 tight">' + esc(g.j) + '</h2><ol class="slots">';
  for (let k = 0; k < g.n; k++) {

  }
  h += '</ol></section>';
  if (g.res === "ok") {
    h += '<section class="card fb good"><b>Urutan tepat.</b><p>Kamu mendapat 15 XP.</p><div class="row"><button class="btn" data-a="startgame" data-g="urut">Soal berikutnya</button><button class="btn ghost" data-a="quitgame">Pilih game lain</button></div></section>';
  } else {
    if (g.res === "no") h += '<section class="card fb wrong"><b>Belum tepat.</b><p>Urutan yang benar: ' + g.order.map((t, i) => (i + 1) + ". " + esc(t)).join(" | ") + '</p><div class="row"><button class="btn" data-a="startgame" data-g="urut">Coba soal baru</button></div></section>';
    else h += '<div class="opts">' + g.items.filter(x => !g.pick.includes(x.i)).map(x => '<button class="opt" data-a="upick" data-i="' + x.i + '">' + esc(x.t) + '</button>').join("") + '</div><div class="row"><button class="btn ghost sm" data-a="uundo"' + (g.pick.length ? "" : " disabled") + '>Hapus pilihan terakhir</button></div>';
  }
  return h;
}
function upick(i) {
  const g = ui.game; if (g.res || g.pick.includes(i)) return;
  g.pick.push(i);
  if (g.pick.length === g.n) {
    const ok = g.pick.every((k, p) => k === p);
    g.res = ok ? "ok" : "no";

  render();
}

/* --- kata acak --- */
function newTiles() {
  const g = ui.game; const w = g.w[g.i][0];

function gKata(g) {

function ktile(k) {
  const g = ui.game; if (g.msg === "ok" || g.ans.includes(k)) return;
  g.ans.push(k);

  if (g.ans.length === w.length) {

    else { g.msg = "no"; render(); timers.push(setTimeout(() => { g.ans = []; g.msg = ""; if (ui.game === g) render(); }, 700)); return; }
  }
  render();
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nama") { S.nama = t.value; save(); return; }
  if (t.id === "kelas") { S.kelas = t.value; save(); return; }
  const k = t.dataset && t.dataset.lk; if (!k) return;
  if (k === "nama") { S.nama = t.value; save(); return; }
  if (k === "kelas") { S.kelas = t.value; save(); return; }
  const d = lkData(ui.lk);
  if (k === "i" || k === "u") d[k][+t.dataset.k] = t.value;
  else if (k === "r") d.r[+t.dataset.k] = t.checked;
  else d[k] = t.value;
  if (k === "i") d.chk = null;
  save();
});

/* ===== boot ===== */
(function () {
  const h = (location.hash || "").replace("#", "");
  if (TABS.some(t => t[0] === h)) ui.tab = h;
  render();
})();

(function () {
  const el = document.getElementById("intro"); if (!el) return;
  const off = () => { el.classList.add("off"); };
  const t = setTimeout(off, 3600);
  document.getElementById("introskip").addEventListener("click", () => { clearTimeout(t); off(); });
  el.addEventListener("animationend", e => { if (e.animationName === "introout") off(); });
})();
</script>
